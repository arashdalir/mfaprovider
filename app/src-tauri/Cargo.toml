[package]
name = "app"
description = "Tauri shell: thin IPC commands and platform plugins around mfa-core."
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
mfa-core = { path = "../../core/mfa-core", version = "0.0.0" }
mfa-storage = { path = "../../core/mfa-storage", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", default-features = false, features = ["serde-compat"] }
getrandom = "0.4.3"

[dev-dependencies]
serde_json = "1"

# Key derivation is slow unoptimised; keep unlock-heavy tests fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
